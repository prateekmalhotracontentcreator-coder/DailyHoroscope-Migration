name: MongoDB Weekly Backup

on:
  # Every Sunday at 2:00 AM IST (20:30 UTC Saturday)
  schedule:
    - cron: '30 20 * * 6'
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  backup:
    name: Full DB dump → GitHub Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install mongodump
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.16.0.tgz \
            -O /tmp/mongo-tools.tgz
          tar -xzf /tmp/mongo-tools.tgz -C /tmp
          sudo mv /tmp/mongodb-database-tools-*/bin/mongodump /usr/local/bin/mongodump
          mongodump --version

      - name: Run full backup
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          mkdir -p backup
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          OUTFILE="backup/horoscope_db_${TIMESTAMP}.gz"
          mongodump --uri="$MONGO_URL" --db=horoscope_db --gzip --archive="$OUTFILE"
          echo "OUTFILE=$OUTFILE" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          du -sh "$OUTFILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ env.TIMESTAMP }}
          path: backup/*.gz
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## MongoDB Backup" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| File | ${{ env.OUTFILE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Retention | 90 days |" >> $GITHUB_STEP_SUMMARY
          echo "| Restore | \`mongorestore --uri=\$MONGO_URL --db=horoscope_db --gzip --archive=<file>\` |" >> $GITHUB_STEP_SUMMARY
